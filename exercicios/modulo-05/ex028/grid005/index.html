<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
        .container {
            border: 2px solid #ff0000;

            display: grid;

            grid-template-columns: 1fr 2fr 1fr; /* fr é uma unidade de medida relativa, onde 1fr representa uma fração do espaço disponível. Usando o 2x ou x vezes, divide-se proporcionalmente pela largura do container. */
            gap: 20px;

            place-items: normal normal; /* align-items e justify-items juntos. */

            /* align-items: stretch;
            justify-items: stretch; */

            place-content: normal normal; /* align-content e justify-content juntos. */

            /*align-content: normal;
            justify-content: normal; */

            grid-auto-rows: 100px;
        }
        .item {
            background-color: #d8cece;
            padding: 10px;
            text-align: center;
            border: 1px solid #000000;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item item1">Item 1</div>
        <div class="item item2">Item 2</div>
        <div class="item item3">Item 3</div>
        <div class="item item4">Item 4</div>
        <div class="item item5">Item 5</div>
        <div class="item item6">Item 6</div>
        <div class="item item7">Item 7</div>
        <div class="item item8">Item 8</div>
        <div class="item item9">Item 9</div>
    </div>
</body>
</html>
